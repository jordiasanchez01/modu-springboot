get:
  tags:
    - Categories
  summary: Get categories
  description: Return a list of all available model categories.
  operationId: getCategories

  responses:
    '200':
      description: List of available categories
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/HomeCategoryResponse.yaml'
    '500':
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: './../components/schemas/ErrorResponse.yaml'
