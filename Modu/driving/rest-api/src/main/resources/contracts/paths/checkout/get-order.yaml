get:
  tags:
    - Checkout
  summary: Displays Order details
  description: Displays the details of an approved order
  operationId: getOrder
  parameters:
    - name: orderId
      in: path
      required: true
      description: Order ID (Long)
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    '200':
      description: Order retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OrderResponse.yaml'
    '404':
      description: Requested order could not be found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
