patch:
  tags:
    - Cart
  summary: Update item´s quantity in the user´s cart
  description: Updates indicated items quantity in the user´s cart
  operationId: updateCartItemQuantity
  security:
    - deviceAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/UpdateItemRequest.yaml'
  parameters:
    - name: itemId
      in: path
      required: true
      description: CartItem ID
      schema:
        type: integer
        format: int64
        example: 2

  responses:
    '200':
      description: Item updated successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/CartResponse.yaml'
    '400':
      description: Invalid request body. Check the fields for more details.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '404':
      description: Requested item, or product variant, is not found.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '409':
      description: Item could not be updated due to availability issues
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '500':
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'

delete:
  tags:
    - Cart
  summary: Delete requested item from the user´s cart
  description: Delete indicated item byt its ID from the user´s cart
  operationId: deleteCartItem
  security:
    - deviceAuth: []
  parameters:
    - name: itemId
      in: path
      required: true
      description: CartItem ID
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    '204':
      description: Item deleted successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/CartResponse.yaml'
    '500':
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
