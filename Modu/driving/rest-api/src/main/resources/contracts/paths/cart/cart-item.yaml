delete:
  tags:
    - Cart
  summary: Delete requested item from the user´s cart
  description: Delete indicated item byt its ID from the user´s cart. Authentication is needed in Authorization header (user´s device IMEI)
  operationId: deleteCartItem
  security:
    - deviceAuth: []
  parameters:
    - name: itemId
      in: path
      required: true
      description: CartItem ID
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    '204':
      description: Item deleted successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/CartResponse.yaml'
    '400':
      description: Invalid request. Check the fields for more details.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '401':
      description: User authentication by device IMEI is missing.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '500':
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
