get:
  tags:
    - Cart
  summary: Displays the user's cart
  description: Displays the user's cart details and contained items, if any
  operationId: getCart
  parameters:
    - $ref: '../../components/parameters/headerUID.yaml'

  responses:
    '200':
      description: Cart retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/CartResponse.yaml'
    '404':
      description: Requested cart could not be found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'

delete:
  tags:
    - Cart
  summary: Eliminates the user's cart
  description: Eliminates the user's cart and contained items, if any
  operationId: deleteCart
  parameters:
    - $ref: '../../components/parameters/headerUID.yaml'

  responses:
    '204':
      description: Cart deleted successfully
    '404':
      description: Requested cart could not be found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'