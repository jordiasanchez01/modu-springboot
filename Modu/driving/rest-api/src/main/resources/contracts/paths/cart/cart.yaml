get:
  tags:
    - Cart
  summary: Displays the user's cart
  description: Displays the user's cart details and contained items, if any. Authentication is needed in Authorization header (user´s device IMEI)
  operationId: getValidatedCart
  security:
    - deviceAuth: []

  responses:
    '200':
      description: Cart retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ValidatedCartResponse.yaml'
    '400':
      description: Invalid request. Check the fields for more details.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '401':
      description: User authentication by device IMEI is missing.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '404':
      description: Requested cart could not be found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'

put:
  tags:
    - Cart
  summary: Create a new cart
  description: >
    Creates or resets the cart for the device identified by the Authorization header.
     If the device already has an existing cart, it is deleted and a new empty
     cart is created with the same device ID.
  operationId: initializeCart

  responses:
    '201':
      description: Cart created successfully. Returns an empty cart with generated UUID as deviceID and created_at/updated_at timestamps
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/CartResponse.yaml'
    '500':
      description: Unexpected server error. The cart could not be created.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
