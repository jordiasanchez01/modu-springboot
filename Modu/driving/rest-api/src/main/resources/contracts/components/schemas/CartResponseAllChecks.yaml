type: object
required:
  - deviceId
  - createdAt
  - updatedAt
  - totalPrice
  - cart_items
properties:
  deviceId:
    type: string
    example: 100000000000015
  createdAt:
    type: string
    format: date-time
    example: "2026-01-15T10:30:00"
  updatedAt:
    type: string
    format: date-time
    example: "2026-01-15T10:42:15"
  totalPrice:
    type: number
    format: double
    example: 457.15
  cart_items:
    type: array
    items:
      $ref: './CartItemForCartResponse.yaml'
  price_changed_alert:
    $ref: './PriceChangedAlert.yaml'
  insufficient_stock_alert:
    $ref: './InsufficientStockAlert.yaml'
  variant_availability_alert:
    $ref: './VariantAvailabilityAlert.yaml'

