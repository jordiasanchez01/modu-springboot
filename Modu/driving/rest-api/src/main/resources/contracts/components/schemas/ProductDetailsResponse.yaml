type: object
required:
  - product_id
  - title
  - description
  - price
  - url
  - stock
properties:
  product_id:
    type: integer
    format: int64
    example: 1
  title:
    type: string
    example: Classic Denim Jacket
  description:
    type: string
    example: A timeless blue denim jacket with a relaxed fit.
  price:
    type: number
    format: double
    example: 79.99
  url:
    type: string
    example: https://images.unsplash.com/photo-1520975922284-9e0ce8276a2f?auto=format&fit=crop&w=800&q=80
  stock:
    type: array
    items:
      type: object
      required:
        - variant_id
        - size
        - color
        - stock
      properties:
        variant_id:
          type: integer
          format: int64
          example: 2
        size:
          type: string
          example: S
        color:
          type: string
          example: BLACK
        stock:
          type: integer
          example: 10


