type: object
required:
  - id
  - productId
  - productVariantId
  - quantity
  - unitPrice
properties:
  id:
    type: integer
    format: int64
    example: 1
  productId:
    type: integer
    format: int64
    example: 1
  productVariantId:
    type: integer
    format: int64
    example: 1
  quantity:
    type: integer
    example: 13
    minimum: 1
  unitPrice:
    type: number
    format: double
    example: 3.50