type: object
required:
  - deviceId
  - createdAt
  - updatedAt
  - subTotalPrice
  - shippingCosts
  - totalPrice
  - cartItems
properties:
  deviceId:
    type: string
    format: uuid
    example: "ede8e350-8c0b-4eba-a0fc-f06d441f0f10"
  createdAt:
    type: string
    format: date-time
    example: "2026-01-15T10:30:00"
  updatedAt:
    type: string
    format: date-time
    example: "2026-01-15T10:42:15"
  subTotalPrice:
    type: number
    format: double
    example: 39.99
  shippingCosts:
    type: number
    format: double
    example: 0.0
  totalPrice:
    type: number
    format: double
    example: 39.99
  cartItems:
    type: array
    items:
      $ref: './CartItemForCartResponse.yaml'