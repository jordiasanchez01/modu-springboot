type: object
required:
  - userId
  - createdAt
  - total_price
  - cart_items
properties:
  userId:
    type: integer
    format: int64
    example: 1
  createdAt:
    type: string
    format: date-time
    example: "2026-01-15T10:30:00"
  total_price:
    type: number
    format: double
    example: 86.95
  cart_items:
    type: array
    items:
      $ref: './CartItemResponse.yaml'
  price_changed_alert:
    type: object
    required:
      - price_changed
      - cartItems
    properties:
      price_changed:
        type: boolean
        example: true
      cartItems:
        type: array
        items:
          $ref: './ProductPriceChangeResponse.yaml'


