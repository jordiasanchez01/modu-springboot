type: object
required:
  - userId
  - createdAt
  - updatedAt
  - cart_items
properties:
  userId:
    type: integer
    format: int64
    example: 1
  createdAt:
    type: string
    format: date-time
    example: "2026-01-15T10:30:00"
  updatedAt:
    type: string
    format: date-time
    example: "2026-01-15T10:42:15"
  cart_items:
    type: array
    items:
      $ref: './CartItemResponse.yaml'
  price_changed_alert:
    $ref: './PriceChangedAlert.yaml'
  insufficient_stock_alert:
    $ref: './InsufficientStockAlert.yaml'

