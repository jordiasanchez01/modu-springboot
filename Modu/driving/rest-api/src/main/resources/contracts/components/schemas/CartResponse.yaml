type: object
required:
  - cart_items
  - price_changed_alert
properties:
  cart_items:
    type: array
    items:
      type: object
      required:
        - item_id
        - variant_id
        - quantity
        - stock_actual
      properties:
        item_id:
          type: integer
          format: int64
          example: 1
        variant_id:
          type: integer
          format: int64
          example: 2
        quantity:
          type: integer
          example: 2
        stock_actual:
          type: integer
          example: 10
  price_changed_alert:
    type: object
    required:
      - price_changed
    properties:
      price_changed:
        type: boolean
        example: true
      cartItems:
        type: array
        items:
          type: object
          required:
            - item_id
            - new_price
          properties:
            item_id:
              type: integer
              format: int64
              example: 1
            new_price:
              type: number
              format: double
              example: 39.99


