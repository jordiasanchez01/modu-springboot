type: object
required:
  - id
  - productVariantId
  - currentStock
  - quantity
  - unitPrice
  - totalPrice
properties:
  id:
    type: integer
    format: int64
    example: 1
  productVariantId:
    type: integer
    format: int64
    example: 1
  currentStock:
    type: integer
    example: 25
  quantity:
    type: integer
    example: 13
    minimum: 1
  unitPrice:
    type: number
    format: double
    example: 3.50
  totalPrice:
    type: number
    format: double
    example: 3.50


