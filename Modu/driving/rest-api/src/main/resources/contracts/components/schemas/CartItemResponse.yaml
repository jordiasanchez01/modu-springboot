type: object
required:
  - id
  - productVariantId
  - quantity
properties:
  id:
    type: integer
    format: int64
    example: 1
  productVariantId:
    type: integer
    format: int64
    example: 1
  unitPrice:
    type: number
    format: double
    example: 3.50
  quantity:
    type: integer
    example: 13
  currentStock:
    type: integer
    example: 25
  totalPrice:
    type: number
    format: double
    example: 3.50


