services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_DB: modu_db
      POSTGRES_USER: modu_user
      POSTGRES_PASSWORD: modu_pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U modu_user -d modu_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgAdmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data: